<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/auth.css" />
    <title>Register - ShopNow</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white py-3 fixed-top c-shadow">
      <div class="container-lg">
        <a class="navbar-brand nav--brand-name" href="../index.html"
          >ShopNow.co</a
        >
      </div>
    </nav>

    <!-- Register Section -->
    <section class="auth-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-6">
            <div class="auth-card">
              <div class="text-center mb-4">
                <h1 class="auth-title">Create Account</h1>
                <p class="text-muted">Join ShopNow and start shopping</p>
              </div>

              <form id="registerForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="firstName"
                      name="firstName"
                      placeholder="John"
                      required
                    />
                    <div class="invalid-feedback"></div>
                  </div>

                  <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="lastName"
                      name="lastName"
                      placeholder="Doe"
                      required
                    />
                    <div class="invalid-feedback"></div>
                  </div>

                  <div class="col-12">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="email"
                      placeholder="your@email.com"
                      required
                    />
                    <div class="invalid-feedback"></div>
                  </div>

                  <div class="col-12">
                    <label for="phone" class="form-label"
                      >Phone Number (Optional)</label
                    >
                    <input
                      type="tel"
                      class="form-control"
                      id="phone"
                      name="phone"
                      placeholder="+234 123 456 7890"
                    />
                    <div class="invalid-feedback"></div>
                  </div>

                  <div class="col-12">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-group">
                      <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        required
                      />
                      <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                      >
                        <i class="fa-solid fa-eye"></i>
                      </button>
                    </div>
                    <div class="invalid-feedback"></div>
                    <small class="text-muted">
                      Must be at least 8 characters with uppercase, lowercase,
                      and number
                    </small>
                  </div>

                  <div class="col-12">
                    <label for="confirmPassword" class="form-label"
                      >Confirm Password</label
                    >
                    <div class="password-input-group">
                      <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                      />
                      <button
                        type="button"
                        class="password-toggle"
                        id="toggleConfirmPassword"
                      >
                        <i class="fa-solid fa-eye"></i>
                      </button>
                    </div>
                    <div class="invalid-feedback"></div>
                  </div>

                  <div class="col-12">
                    <div class="form-check">
                      <input
                        type="checkbox"
                        class="form-check-input"
                        id="agreeTerms"
                        required
                      />
                      <label class="form-check-label" for="agreeTerms">
                        I agree to the <a href="#">Terms of Service</a> and
                        <a href="#">Privacy Policy</a>
                      </label>
                      <div class="invalid-feedback"></div>
                    </div>
                  </div>

                  <div class="col-12">
                    <button
                      type="submit"
                      class="btn bg-black text-white w-100 rounded-pill fw-bold py-2"
                      id="registerBtn"
                    >
                      Create Account
                    </button>
                  </div>
                </div>
              </form>

              <div class="text-center mt-4">
                <p class="mb-0">
                  Already have an account?
                  <a href="./login.html" class="fw-bold text-decoration-none">
                    Sign In
                  </a>
                </p>
              </div>

              <div class="divider my-4">
                <span>Or sign up with</span>
              </div>

              <div class="row g-2">
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark w-100">
                    <i class="fa-brands fa-google me-2"></i> Google
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark w-100">
                    <i class="fa-brands fa-facebook-f me-2"></i> Facebook
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./register.js"></script>
  </body>
</html>
