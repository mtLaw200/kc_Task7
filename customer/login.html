<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/auth.css" />
    <title>Login - ShopNow</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white py-3 fixed-top c-shadow">
      <div class="container-lg">
        <a class="navbar-brand nav--brand-name" href="../index.html"
          >ShopNow.co</a
        >
      </div>
    </nav>

    <!-- Login Section -->
    <section class="auth-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-5">
            <div class="auth-card">
              <div class="text-center mb-4">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="text-muted">Sign in to your account</p>
              </div>

              <!-- Demo Credentials Info -->
              <div class="alert alert-info" role="alert">
                <strong>Demo Mode:</strong><br />
                Customer: Use any email/password you registered with<br />
                Admin: admin@shopnow.co / admin123
              </div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email Address</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    required
                  />
                  <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="password-input-group">
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      placeholder="Enter your password"
                      required
                    />
                    <button
                      type="button"
                      class="password-toggle"
                      id="togglePassword"
                    >
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                  <div class="invalid-feedback"></div>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="rememberMe"
                    />
                    <label class="form-check-label" for="rememberMe">
                      Remember me
                    </label>
                  </div>
                  <a href="#" class="text-decoration-none">Forgot password?</a>
                </div>

                <button
                  type="submit"
                  class="btn bg-black text-white w-100 rounded-pill fw-bold py-2"
                  id="loginBtn"
                >
                  Sign In
                </button>
              </form>

              <div class="text-center mt-4">
                <p class="mb-0">
                  Don't have an account?
                  <a
                    href="./register.html"
                    class="fw-bold text-decoration-none"
                  >
                    Sign Up
                  </a>
                </p>
              </div>

              <div class="divider my-4">
                <span>Or continue with</span>
              </div>

              <div class="row g-2">
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark w-100">
                    <i class="fa-brands fa-google me-2"></i> Google
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark w-100">
                    <i class="fa-brands fa-facebook-f me-2"></i> Facebook
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./login.js"></script>
  </body>
</html>
